name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the smallest reproduction and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mockline and Node version
    validations:
      required: true
